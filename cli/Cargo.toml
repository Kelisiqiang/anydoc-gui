[package]
name = "anydoc-win"
version = "0.2.0"
description = "AnyDoc GUI - Document to Markdown converter powered by firecrawl/anydoc"
authors = ["AnyDoc Team"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "anydoc"
path = "src/main.rs"

[lib]
name = "anydoc_win_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
anydoc = "0.2.4"
anyhow = "1.0"
walkdir = "2.4"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 体积优化 - 极致小
[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
incremental = false

[profile.release.package."*"]
opt-level = "z"